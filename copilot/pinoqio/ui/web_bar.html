<style>
  body { max-width:560px; margin:0 auto; overflow-y:auto; }
  #webbar { flex:none; display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 10px;
    background:var(--card); border:1px solid var(--line); border-radius:10px; }
  #webbar p { flex:1 1 220px; margin:0; font-size:12px; color:var(--mute); }
  #webbar a { color:var(--accent); }
  #webbar button { font:inherit; font-weight:700; padding:6px 14px; border:0; border-radius:8px; cursor:pointer;
    background:var(--accent); color:#0f1115; }
  #webbar button:disabled { background:#33363f; color:var(--mute); cursor:default; }
  #webbar button.alt { background:#222733; color:var(--txt); border:1px solid var(--line); }
</style>
<div id="webbar">
  <button id="play">Play demo</button>
  <button id="live" class="alt hidden">Try live</button>
  <p>Pinoqio listens to a negotiation call and shows, live, how likely the other side is lying and why.
    This is a recorded call. <a href="https://github.com/bioztar/pinoqio" target="_blank" rel="noopener">GitHub</a></p>
</div>
<script>
(() => {
  window.PINOQIO_WEB = true;
  window.PINOQIO_LIVE = {{LIVE}};
  const $ = id => document.getElementById(id);
  const wsUrl = path => `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}${path}`;
  const setStatus = t => { $('status').textContent = t; };
  window.pqWeb = { $, wsUrl, setStatus };
  $('say').classList.add('hidden');   // the voice interjection only exists in the desktop app

  const audio = new Audio('/demo/call.mp3');
  let ws = null;

  function stop() {
    if (ws) { ws.onclose = null; ws.close(); ws = null; }
    audio.pause();
  }
  window.pqWeb.stopDemo = stop;

  function finish(label) {
    $('play').textContent = 'Replay demo';
    $('play').disabled = false;
    setStatus(label);
  }

  $('play').addEventListener('click', () => {
    stop();
    window.pinoqio.reset();
    $('play').disabled = true;
    setStatus('starting…');
    ws = new WebSocket(wsUrl('/demo'));
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === 'end') { stop(); finish('demo finished'); return; }
      window.pinoqio.handle(m);
    };
    ws.onclose = () => { audio.pause(); finish('disconnected'); };
    ws.onopen = async () => {
      try {
        audio.currentTime = 0;
        await audio.play();
        ws.send('start');            // server starts the event clock when the audio does
        $('play').textContent = 'Playing…';
        setStatus('playing recorded call');
      } catch (err) {
        finish(`audio blocked: ${err.message}`);
      }
    };
  });
  setStatus('press Play demo');
})();
</script>
