<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinoqio</title>
<meta name="description" content="Pinoqio listens to a negotiation call and shows, live, how likely the other side is lying and why.">
<link rel="icon" type="image/png" href="/static/logo-256.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Pinoqio: a lie detector for your calls">
<meta property="og:description" content="Pinoqio listens to a negotiation call and shows, live, how likely the other side is lying and why.">
<meta property="og:image" content="https://pinoqio.pro7ocol.com/static/cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://pinoqio.pro7ocol.com/static/cover.jpg">
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262b36; --txt:#e8eaf0; --mute:#8a91a0; --p:#3ecf6e; --accent:#6ea8ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt);
    font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display:flex; flex-direction:column; padding:8px 10px; gap:5px; overflow:hidden; }
  .hero { position:relative; text-align:center; flex:none; }
  #pct { font-size:20px; font-weight:700; color:var(--p); transition:color .6s; margin-top:-4px; }
  #pct small { color:var(--mute); font-weight:400; font-size:12px; }
  /* five stage frames stacked; the one for the current % fades in, the others out (up and down) */
  #face { position:relative; width:216px; height:190px; margin:0 auto; }
  #face img { position:absolute; inset:0; width:100%; height:100%; opacity:0; transition:opacity .4s ease-in-out; }
  #face img.on { opacity:1; }
  .scroll { overflow-y:auto; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:5px 10px; flex:none; }
  .panel h3 { margin:0 0 4px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); }
  #chips { display:flex; flex-wrap:wrap; gap:5px; min-height:24px; }
  .chip { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); background:#222733; }
  .chip.strong { border-color:#d96a5b; color:#ffb4a8; }
  #badge { text-align:center; font-size:11px; color:var(--mute); min-height:14px; }
  #contra .q { font-style:italic; }
  #contra .t { color:var(--mute); font-size:12px; }
  #ask { color:var(--accent); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:2px 4px; }
  th { color:var(--mute); font-weight:500; font-size:11px; }
  tr:nth-child(even) td { background:#1c202a; }
  #transcript { flex:1; min-height:40px; display:flex; flex-direction:column; gap:4px; }
  .u { max-width:85%; padding:4px 9px; border-radius:10px; font-size:13px; }
  .u.them { align-self:flex-start; background:#1d2b44; border-left:3px solid var(--accent); }
  .u.me { align-self:flex-end; background:#1b1e26; color:var(--mute); }
  #say { flex:none; font-size:18px; font-weight:800; padding:8px; border:0; border-radius:10px; cursor:pointer;
    background:#d9483b; color:#fff; }
  #say:disabled { background:#33363f; color:var(--mute); cursor:default; }
  #status { flex:none; font-size:11px; color:var(--mute); text-align:center; }
  .hidden { display:none; }
  #foot { flex:none; display:flex; justify-content:center; gap:12px; align-items:center; }
  .link { background:none; border:0; color:var(--accent); font-size:11px; cursor:pointer; padding:0; }
  /* full-height overlay on a dark backdrop; close returns to the live view */
  #summary { position:fixed; inset:0; z-index:5; border-radius:0; border:0; padding:12px 14px; font-size:14px;
    background:rgb(10,12,16); }
  #summary h3 { position:sticky; top:-12px; background:rgb(10,12,16); padding:6px 0 8px; margin:-12px 0 6px; font-size:12px; z-index:1; }
  #summary h3 .link { float:right; font-size:13px; border:1px solid var(--line); border-radius:6px; padding:2px 10px; }
  #summary h3 small { text-transform:none; letter-spacing:0; }
  #sum-body h4 { margin:8px 0 2px; font-size:11px; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; }
  #sum-body div { padding:1px 0; }
  #sum-body .changed { color:#ffb4a8; }
  #sum-body .q { font-style:italic; color:var(--mute); }
  #sum-body .email { color:var(--accent); font-weight:600; }
</style>
</head>
<body>
<div class="hero">
  <div id="face" role="img" aria-label="Pinoqio; the longer the nose, the likelier the lie">
    <img src="/static/nose/0.webp" alt="" class="on"><img src="/static/nose/1.webp" alt=""><img src="/static/nose/2.webp" alt=""><img src="/static/nose/3.webp" alt=""><img src="/static/nose/4.webp" alt="">
  </div>
  <div id="pct">0% <small>chance of lying</small></div>
  <div id="badge"></div>
</div>

<div class="panel"><h3>Evidence</h3><div id="chips"></div></div>
<div class="panel hidden" id="contra"><h3>Contradiction</h3>
  <div><span class="t" id="c-then-t"></span> <span class="q" id="c-then"></span></div>
  <div><span class="t" id="c-now-t"></span> <span class="q" id="c-now"></span></div>
</div>
<div class="panel"><h3>Ask this next</h3><div id="ask">…</div></div>
<div class="panel"><h3>Promise ledger</h3>
  <table><thead><tr><th>Who</th><th>Item</th><th>Value</th></tr></thead><tbody id="ledger"></tbody></table>
</div>
<div class="panel scroll hidden" id="summary">
  <h3>Call summary <small id="sum-model"></small> <button id="sum-close" class="link">close</button></h3>
  <div id="sum-body"></div>
</div>
<div class="panel scroll" id="transcript"></div>
<button id="say" disabled>Say it</button>
<div id="foot"><div id="status">connecting…</div><button id="sum-btn" class="link">Summary</button></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const times = new Map();          // utterance id -> t_start
  const sentAt = new Map();         // utterance id -> wall-clock ms, for model latency
  let contradiction = null;         // latest contradiction seen
  let prob = 0;

  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const clear = el => { while (el.firstChild) el.removeChild(el.firstChild); };
  const add = (parent, tag, text, cls) => {
    const el = document.createElement(tag);
    el.textContent = text;
    if (cls) el.className = cls;
    parent.appendChild(el);
    return el;
  };

  function setProb(p) {
    prob = p;
    const hue = Math.round(120 - 120 * p);          // green -> amber -> red
    document.documentElement.style.setProperty('--p', `hsl(${hue} 75% 52%)`);
    const stage = Math.min(4, Math.floor(p * 5));   // 0-20, 20-40, 40-60, 60-80, 80-100 %
    $('face').querySelectorAll('img').forEach((img, i) => img.classList.toggle('on', i === stage));
    $('pct').firstChild.nodeValue = `${Math.round(p * 100)}% `;
  }

  function onUtterance(u) {
    times.set(u.id, u.t_start);
    sentAt.set(u.id, performance.now());
    const box = $('transcript');
    add(box, 'div', u.text, `u ${u.speaker}`);
    box.scrollTop = box.scrollHeight;
  }

  function onVerdict(v) {
    setProb(v.probability);
    const chips = $('chips'); clear(chips);
    // kind "model" chips say which model answered / verified; they go in the badge, not the evidence
    v.chips.filter(c => c.kind !== 'model').forEach(c => add(chips, 'span', c.label, 'chip' + (c.weight >= 0.25 ? ' strong' : '')));
    $('badge').textContent = v.chips.filter(c => c.kind === 'model').map(c => c.label).join(' · ');
    $('ask').textContent = v.ask_next || '…';
    const led = $('ledger'); clear(led);
    v.ledger.forEach(r => {
      const tr = document.createElement('tr');
      add(tr, 'td', r.who); add(tr, 'td', r.item); add(tr, 'td', r.value);
      led.appendChild(tr);
    });
    if (v.contradiction) {
      const c = v.contradiction;
      contradiction = { ...c, nowT: times.get(v.utterance_id) };
      $('contra').classList.remove('hidden');
      const thenT = times.get(c.then_utterance_id);
      $('c-then-t').textContent = thenT == null ? 'then' : `then ${fmt(thenT)}`;
      $('c-then').textContent = `“${c.then_quote}”`;
      $('c-now-t').textContent = contradiction.nowT == null ? 'now' : `now ${fmt(contradiction.nowT)}`;
      $('c-now').textContent = `“${c.now_quote}”`;
      $('say').disabled = false;
    }
    const t0 = sentAt.get(v.utterance_id);
    if (t0 != null) $('status').textContent = `connected · model ${((performance.now() - t0) / 1000).toFixed(1)}s`;
  }

  $('say').addEventListener('click', async () => {
    if (!contradiction) return;
    const text = `Earlier you said: ${contradiction.then_quote}. Just now you said: ${contradiction.now_quote}. Which one is it?`;
    $('say').disabled = true;
    try {
      const r = await fetch('/interject', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
      if (!r.ok) throw new Error(r.status);
    } catch (e) {
      $('status').textContent = `interject failed: ${e.message}`;
    }
    setTimeout(() => { $('say').disabled = false; }, 3000);
  });

  let haveSummary = false;
  function onSummary(s) {
    haveSummary = true;
    $('sum-model').textContent = s.model ? `· ${s.model}` : '';
    const body = $('sum-body'); clear(body);
    const section = (title, rows) => {
      if (!rows.length) return;
      add(body, 'h4', title);
      rows.forEach(([text, cls, quote]) => {
        const row = add(body, 'div', text, cls);
        if (quote) add(row, 'span', ` “${quote}”`, 'q');
      });
    };
    section('Commitments', s.commitments.map(c => [
      `${c.who === 'me' ? 'You' : 'They'}: ${c.item} = ${c.value}${c.changed ? ` (was ${c.was || '?'})` : ''}`,
      c.changed ? 'changed' : '']));
    section('Open questions', s.open_questions.map(q => [q]));
    section('Red flags', s.red_flags.map(f => [f.text, '', f.quote]));
    if (s.next_email) section('Next email', [[s.next_email, 'email']]);
    $('summary').classList.remove('hidden');
  }

  $('sum-close').addEventListener('click', () => $('summary').classList.add('hidden'));
  $('sum-btn').addEventListener('click', async () => {
    if (haveSummary) { $('summary').classList.toggle('hidden'); return; }
    $('status').textContent = 'summarising…';
    try {
      const r = await fetch('/summary', { method: 'POST' });
      if (!r.ok) throw new Error(r.status);
      if (!(await r.json()).ok) $('status').textContent = 'nothing to summarise yet';
    } catch (e) {
      $('status').textContent = 'summary appears when the call ends';
    }
  });

  function connect() {
    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
    ws.onopen = () => { $('status').textContent = 'connected'; };
    ws.onmessage = e => handle(JSON.parse(e.data));
    ws.onclose = () => { $('status').textContent = 'disconnected, retrying…'; setTimeout(connect, 1000); };
  }

  function handle(m) {
    if (m.type === 'utterance') onUtterance(m); else if (m.type === 'verdict') onVerdict(m);
    else if (m.type === 'summary') onSummary(m);
  }

  function reset() {
    times.clear(); sentAt.clear(); contradiction = null;
    ['chips', 'ledger', 'transcript'].forEach(id => clear($(id)));
    $('contra').classList.add('hidden');
    $('summary').classList.add('hidden'); haveSummary = false;
    $('ask').textContent = '…';
    $('say').disabled = true;
    setProb(0);
  }

  setProb(0);
  // web mode (web_bar.html) drives the UI itself through window.pinoqio instead of /ws
  window.pinoqio = { handle, reset };
  if (!window.PINOQIO_WEB) connect();
})();
</script>
</body>
</html>
