[project]
name = "pinoqio"
version = "0.1.0"
description = "Negotiation call copilot: live lie-likelihood with evidence, on any Mac call app"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy",
    "sounddevice",
    "soundfile",
    "praat-parselmouth",
    "websockets",
    "httpx",
    "google-genai",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "pywebview",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
