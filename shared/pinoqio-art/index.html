<meta charset="utf-8">
<title>Pinoqio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: one cinematic frame, full width; a quiet control bar under it. Single dark look by choice (dusk photo). */
:root {
  color-scheme: dark;
  --bg: #120e0b; --surface: #1c1612; --ink: #f4ebdd; --muted: #b8a891; --line: #3a2f26;
  --teal: #4fb3a6; --lie: #ff8a6a;
  --display: "Cormorant Garamond", Georgia, serif; --body: "Golos Text", -apple-system, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1400px; margin: 0 auto; padding-block: 1.2rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
.brand { font: 600 2.2rem/1 var(--display); letter-spacing: -0.02em; }
.brand em { color: var(--teal); font-style: italic; font-weight: 500; }
.event { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.stage { position: relative; aspect-ratio: 3 / 2; max-width: 100%; border-radius: 14px; overflow: hidden; background: var(--surface); }
.frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* The long nose lives in a horizontal band; revealing it left to right grows the nose segment by segment */
@property --reach { syntax: "<percentage>"; inherits: true; initial-value: 29.4%; }
@property --tip-y { syntax: "<percentage>"; inherits: true; initial-value: 20%; }
.frame.nose {
  -webkit-mask-image: linear-gradient(to bottom, transparent 6%, #000 10.5%, #000 25%, transparent 30%),
    linear-gradient(to right, transparent var(--nose-left), #000 calc(var(--nose-left) + 0.5%), #000 calc(var(--reach) - 1.4%), transparent var(--reach));
  mask-image: linear-gradient(to bottom, transparent 6%, #000 10.5%, #000 25%, transparent 30%),
    linear-gradient(to right, transparent var(--nose-left), #000 calc(var(--nose-left) + 0.5%), #000 calc(var(--reach) - 1.4%), transparent var(--reach));
  -webkit-mask-composite: source-in; mask-composite: intersect; }
.stage { transition: --reach 0.75s cubic-bezier(.2, 1.35, .4, 1), --tip-y 0.75s cubic-bezier(.2, 1.35, .4, 1); }
.tip { position: absolute; left: calc(var(--reach) - 1.9%); top: calc(var(--tip-y) - 1.55%); width: 1.25%; height: 3.1%;
  border-radius: 50%; pointer-events: none;
  background: repeating-radial-gradient(circle at 45% 45%, #d9a46a 0 9%, #b8793f 9% 14%), #c88a4c;
  box-shadow: inset -2px -2px 4px rgba(70, 36, 12, 0.55), inset 2px 2px 3px rgba(255, 220, 170, 0.35), 2px 2px 6px rgba(0, 0, 0, 0.25);
  transition: opacity 0.3s; }
.tip[hidden] { display: block !important; opacity: 0; }
/* Expression changes only inside a soft ellipse around the head */
.frame.face { opacity: 0; transition: opacity 0.6s ease;
  -webkit-mask-image: radial-gradient(ellipse 12% 19% at 25% 15%, #000 72%, transparent 100%);
  mask-image: radial-gradient(ellipse 12% 19% at 25% 15%, #000 72%, transparent 100%); }
.frame.face.on { opacity: 1; }
.stage { --nose-left: 29.4%; }
.flash { position: absolute; inset: 0; background: radial-gradient(circle at 40% 30%, rgba(255,138,106,0.35), transparent 60%); opacity: 0; pointer-events: none; }
.flash.go { animation: flash 0.7s ease-out; }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
.bubble { position: absolute; right: 4%; bottom: 7%; max-width: min(30rem, 60%); background: rgba(18,14,11,0.72);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(244,235,221,0.18);
  border-radius: 18px 18px 4px 18px; padding: 0.9rem 1.2rem 1rem; display: flex; flex-direction: column; gap: 0.3rem; }
.bubble .meta { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.bubble .meta b { color: var(--teal); font-weight: 600; }
.bubble p { margin: 0; font: 600 clamp(1.2rem, 2.4vw, 2rem)/1.15 var(--display); text-wrap: balance; }
.bubble.say { animation: say 0.45s ease-out; }
@keyframes say { 0% { opacity: 0.2; transform: translateY(6px); } 100% { opacity: 1; transform: none; } }
.count { position: absolute; left: 3%; bottom: 5%; font: 600 clamp(3rem, 9vw, 7rem)/0.8 var(--display); color: var(--ink);
  text-shadow: 0 4px 24px rgba(0,0,0,0.5); font-variant-numeric: tabular-nums; }
.count small { display: block; font: 500 0.75rem/1.4 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 0.5rem; text-shadow: none; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.8rem 1.4rem; }
.meter { display: flex; gap: 4px; flex: 1 1 14rem; }
.meter i { flex: 1; height: 10px; border-radius: 3px; background: var(--line); transition: background 0.3s; }
.meter i.on { background: linear-gradient(90deg, #c8823f, #e0a868); }
button { font: 600 0.95rem/1 var(--body); border-radius: 8px; padding: 0.8rem 1.2rem; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
button.lie { background: var(--teal); border-color: var(--teal); color: #08201d; }
button:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
.hint { font-size: 0.85rem; color: var(--muted); }
.hint code { color: var(--ink); }
.embed .top, .embed .bar, .embed .hint { display: none; }
.embed body { padding: 0; }
.embed .wrap { padding: 0; max-width: none; }
.embed .stage { border-radius: 0; }
@media (max-width: 640px) { .bubble { left: 4%; right: 4%; max-width: none; top: 4%; bottom: auto; } }
@media (prefers-reduced-motion: reduce) { .frame, .bubble, .flash { transition: none !important; animation: none !important; } }
</style>
<div class="wrap">
  <div class="top"><span class="brand">Pinoq<em>io</em></span><span class="event">Hack Day · Barcelona · 2026</span></div>
  <div class="stage" id="stage">
    <img class="frame base" src="frames/frame-0.jpg" alt="Пинокио в очках и бирюзовой водолазке на крыше в Барселоне на закате"><img class="frame face" data-face="1" src="frames/expr-1.jpg" alt=""><img class="frame face" data-face="2" src="frames/expr-2.jpg" alt=""><img class="frame nose" id="nose" src="frames/frame-8.jpg" alt="">
    <div class="tip" id="tip" hidden></div>
    <div class="flash" id="flash"></div>
    <div class="count" id="count">0<small>противоречий</small></div>
    <div class="bubble" id="bubble"><div class="meta"><b>Pinoqio замечает</b><span id="mood">Пока верю</span></div><p id="line">Я слушаю. Пока всё сходится.</p></div>
  </div>
  <div class="bar">
    <div class="meter" id="meter" aria-hidden="true"></div>
    <button class="lie" id="lie" type="button">Соврать ещё раз</button>
    <button id="reset" type="button">Сброс</button>
  </div>
  <p class="hint">Для живого режима: <code>pinoqio.lie()</code> добавляет противоречие, <code>pinoqio.setLevel(p)</code> ставит вероятность 0…1, <code>pinoqio.say(текст)</code> меняет реплику. Встраивание без кнопок: <code>?embed</code>.</p>
</div>
<script>
(() => {
  const MAX = 8;
  const lines = [
    "Слушаю. Пока всё сходится. Даже подозрительно.",
    "Минуту назад было иначе. Я не придираюсь, у меня просто деревянная память.",
    "Две версии одной истории. Вы не врёте, вы выпускаете обновления. Без changelog.",
    "Ваши показания расходятся быстрее, чем курс песо.",
    "Депозит то возвращается, то нет. Это уже не договор, это сериал с открытым финалом.",
    "Я бы сказал «верю», но мой нос подал апелляцию.",
    "Мой нос уже видно с Монжуика. Гиды включили его в экскурсию.",
    "На носу пророс росток. Даже природа решила, что вашей истории не хватает удобрений.",
    "Воробей свил гнездо и оформил ипотеку. Говорит, правды тут не будет лет тридцать."
  ];
  const $ = id => document.getElementById(id);
  const meter = $("meter");
  for (let i = 0; i < MAX; i++) meter.appendChild(document.createElement("i"));
  const word = n => n % 10 === 1 && n !== 11 ? "противоречие" : [2, 3, 4].includes(n) ? "противоречия" : "противоречий";
  let lies = -1;
  function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function setLies(v) {
    const n = Math.max(0, Math.min(MAX, Math.round(Number(v) || 0)));
    if (n === lies) return lies;
    const grew = n > lies && lies >= 0;
    lies = n;
    // reveal edge per lie, % of frame width: even growth to 6, the sprout at 7, the sparrow's nest at 8
    const reach = [29.4, 36.5, 43.6, 50.7, 57.8, 64.9, 72, 83.5, 98][n];
    const stage = $("stage");
    stage.style.setProperty("--reach", reach + "%");
    // the nose dips slightly towards the tip; the cap follows its centre line
    stage.style.setProperty("--tip-y", (20.2 + (reach - 36.5) * 0.07).toFixed(2) + "%");
    $("tip").hidden = n === 0 || n === MAX;
    // calm 0-2, suspicious 3-5, smug 6-8
    const face = n >= 6 ? 2 : n >= 3 ? 1 : 0;
    document.querySelectorAll(".frame.face").forEach(img => img.classList.toggle("on", +img.dataset.face === face));
    [...meter.children].forEach((el, i) => el.classList.toggle("on", i < n));
    $("count").firstChild.textContent = n;
    $("count").querySelector("small").textContent = word(n);
    $("line").textContent = lines[n];
    $("mood").textContent = ["Пока верю", "Есть вопросы", "Есть вопросы", "Очень интересно", "Очень интересно", "Очень интересно", "Я предупреждал", "Я предупреждал", "Гнездо свито"][n];
    replay($("bubble"), "say");
    if (grew) replay($("flash"), "go");
    $("lie").disabled = n === MAX;
    return lies;
  }
  $("lie").addEventListener("click", () => setLies(lies + 1));
  $("reset").addEventListener("click", () => setLies(0));
  // Live-mode hooks: the copilot's lie probability (0..1) and its own line for the bubble
  const setLevel = p => setLies(Math.round(Math.max(0, Math.min(1, Number(p) || 0)) * MAX));
  const say = text => { $("line").textContent = String(text); replay($("bubble"), "say"); };
  window.pinoqio = Object.freeze({ setLies, setLevel, say, lie: () => setLies(lies + 1), get lies() { return lies; } });
  if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");
  setLies(parseInt(location.hash.slice(1), 10) || 0);
})();
</script>
